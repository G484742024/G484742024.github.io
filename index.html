
<!DOCTYPE html>
<html lang="ja">
<head>

  <title>自己紹介サイト</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f0f4f8;

    .container {
      max-width: 700px;
      margin: auto;

    <p>趣味はゲームと筋トレです。</p>

    <h2>学んでいること</h2>
    <p>JavaやJavaScript、HTML、CSSなどを学んでいます。</p>

    <h2>今後の目標</h2>
    <p>プログラミングの知識を深め、Webサイトやアプリケーションを開発できるようになりたいです。</p>
  </div>

</html>
